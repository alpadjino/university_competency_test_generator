services:
  db:
    image: postgres:15-alpine
    container_name: diplom_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: diplom_db
    ports:
      - "5432:5432"
    networks:
      - diplom_net

  server:
    build: ./server
    container_name: diplom_server
    ports:
      - "5000:5000"
    environment:
      - OLLAMA_API_URL=http://ollama:11434
      - DATABASE_URL=postgres://user:password@db:5432/diplom_db
      - JWT_SECRET=secret_key
      - PORT=5000
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      - db
      - ollama
    networks:
      - diplom_net

  client:
    build: ./client
    container_name: diplom_client
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server
    stdin_open: true
    tty: true
    networks:
      - diplom_net

  ollama:
    image: ollama/ollama
    container_name: diplom-ollama-llm
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    entrypoint: /bin/sh
    command: -c "ollama serve & sleep 5 && ollama pull hodza/cotype-nano-1.5-unofficial && wait"
    networks:
      - diplom_net

networks:
  diplom_net:
    name: diplom_net
    driver: bridge

volumes:
  postgres_data:
  ollama-data:
