services:
  db:
    image: postgres:15-alpine
    container_name: diplom_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: diplom_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d diplom_db"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - diplom_net

  dbmate:
    image: ghcr.io/amacneil/dbmate:2
    container_name: diplom_dbmate
    restart: "no"
    environment:
      DATABASE_URL: postgres://user:password@db:5432/diplom_db?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
    volumes:
      - ./db/migrations:/db/migrations:ro
    command: ["--wait", "up"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - diplom_net

  server:
    build: ./server
    container_name: diplom_server
    environment:
      - DATABASE_URL=postgres://user:password@db:5432/diplom_db
      - JWT_SECRET=secret_key
      - PORT=5000
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
      dbmate:
        condition: service_completed_successfully
    networks:
      - diplom_net

  worker:
    build: ./worker
    container_name: diplom_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      OLLAMA_API_URL: http://ollama:11434
      DATABASE_URL: postgres://user:password@db:5432/diplom_db
    volumes:
      - ./worker:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
      dbmate:
        condition: service_completed_successfully
      ollama:
        condition: service_started
    networks:
      - diplom_net

  client:
    build: ./client
    container_name: diplom_client
    environment:
      VITE_HMR_CLIENT_PORT: ${APP_PORT:-8080}
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server
    stdin_open: true
    tty: true
    networks:
      - diplom_net

  ollama:
    image: ollama/ollama
    container_name: diplom-ollama-llm
    env_file:
      - .env
    volumes:
      - ollama-data:/root/.ollama
    entrypoint: /bin/sh
    command: -c "ollama serve & sleep 5 && ollama pull \"$$OLLAMA_MODEL\" && wait"
    networks:
      - diplom_net

  angie:
    image: docker.angie.software/angie:latest
    container_name: diplom_angie
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./angie/angie.conf:/etc/angie/angie.conf:ro
    depends_on:
      - client
      - server
    networks:
      - diplom_net

networks:
  diplom_net:
    name: diplom_net
    driver: bridge

volumes:
  postgres_data:
  ollama-data:
